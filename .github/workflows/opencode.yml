name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Pick model from comment
        id: model
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body;
            const models = {
              '--ultra':    'nvidia-build/nvidia/nemotron-3-ultra-550b-a55b',
              '--super':    'nvidia-build/nvidia/nemotron-3-super-120b-a12b',
              '--pro':      'nvidia-build/deepseek-ai/deepseek-v4-pro',
              '--flash':    'nvidia-build/deepseek-ai/deepseek-v4-flash',
              '--nano':     'nvidia-build/nvidia/nemotron-3-nano-30b-a3b',
              '--nano30b':  'nvidia-build/nvidia/nemotron-3-nano-30b-a3b',
              '--glm':      'nvidia-build/z-ai/glm-5.2',
              '--llama49b': 'nvidia-build/meta/llama-3.3-nemotron-super-49b-v1.5',
              '--mistral':  'nvidia-build/nvidia/mistral-nemotron',
              '--minimax-m3': 'nvidia-build/minimaxai/minimax-m3',
              '--minimax-m2': 'nvidia-build/minimaxai/minimax-m2.7',
              '--gemma':    'nvidia-build/google/gemma-4-31b-it',
            };
            let selected = 'nvidia-build/nvidia/nemotron-3-super-120b-a12b';
            for (const [flag, model] of Object.entries(models)) {
              if (body.includes(flag)) { selected = model; break; }
            }
            core.setOutput('model', selected);

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        with:
          model: ${{ steps.model.outputs.model }}
