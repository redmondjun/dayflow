name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, "/oc") ||
      contains(github.event.comment.body, "/opencode")
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Pick model from comment
        id: model
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body;
            const models = {
              "--ultra": "nvidia/nvidia/nemotron-3-ultra-550b-a55b",
              "--super": "nvidia/nvidia/nemotron-3-super-120b-a12b",
              "--pro":   "nvidia/deepseek-ai/deepseek-v4-pro",
              "--flash": "nvidia/deepseek-ai/deepseek-v4-flash",
              "--nano":  "nvidia/nvidia/nemotron-3-nano-30b-a3b",
              "--glm":   "nvidia/z-ai/glm-5.2",
              "--llama": "nvidia/meta/llama-3.3-nemotron-super-49b-v1.5",
              "--mistral":"nvidia/nvidia/mistral-nemotron",
              "--gemma": "nvidia/google/gemma-4-31b-it",
              "--minimax-m3":"nvidia/minimaxai/minimax-m3",
              "--minimax-m2":"nvidia/minimaxai/minimax-m2.7",
            };
            let selected = "nvidia/nvidia/nemotron-3-super-120b-a12b";
            for (const [f, m] of Object.entries(models)) {
              if (body.includes(f)) { selected = m; break; }
            }
            core.setOutput("model", selected);

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        with:
          model: ${{ steps.model.outputs.model }}
