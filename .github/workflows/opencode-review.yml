name: opencode auto-review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        with:
          model: ${{ github.event.action == 'opened' && 'nvidia-build/nvidia/nemotron-3-ultra-550b-a55b' || 'nvidia-build/nvidia/nemotron-3-super-120b-a12b' }}
          prompt: |
            Review this pull request thoroughly:
            - Check for code quality issues, bugs, and security concerns
            - Verify patterns match the rest of the codebase
            - Suggest specific, actionable improvements
            - If you find serious issues, flag them prominently